name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: footera
          POSTGRES_PASSWORD: footera_ci
          POSTGRES_DB: footera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U footera -d footera_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: footera-backend
    env:
      DATABASE_URL: postgresql://footera:footera_ci@localhost:5432/footera_test?schema=public
      FRONTEND_URL: http://localhost:3001
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: footera-backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: footera-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: footera-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  containers:
    name: Build ${{ matrix.name }} container
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./footera-backend
          - name: frontend
            context: ./footera-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: footera/${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
